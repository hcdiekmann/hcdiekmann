<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Hans Christian Diekmann — software that leaves the laptop. The loop: robot, data, software, human, action.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .node rect { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .node text { fill: #e6edf3; font-size: 12px; letter-spacing: 1.5px; text-anchor: middle; }
    .hot rect { stroke: #3fb950; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="898" height="248" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- identity -->
  <text x="44" y="62" class="mono" fill="#8b949e" font-size="12" letter-spacing="3">HANS CHRISTIAN DIEKMANN</text>
  <text x="44" y="108" class="sans" fill="#e6edf3" font-size="32" font-weight="700">Software that</text>
  <text x="44" y="146" class="sans" fill="#3fb950" font-size="32" font-weight="700">leaves the laptop.</text>
  <rect x="330" y="122" width="14" height="28" fill="#3fb950" class="blink"/>
  <text x="44" y="190" class="mono" fill="#8b949e" font-size="13">SWE · Forward Deployed Engineer · Zürich</text>
  <text x="44" y="212" class="mono" fill="#6e7681" font-size="12">robots · fleets · real-time systems · operators</text>

  <!-- the loop -->
  <text x="700" y="36" class="mono" fill="#6e7681" font-size="11" letter-spacing="3" text-anchor="middle">THE LOOP</text>
  <path id="track" d="M590,75 H810 V185 H590 Z" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>

  <circle r="5" fill="#3fb950">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <circle r="10" fill="#3fb950" opacity="0.18">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#f0883e">
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>

  <g class="node hot mono"><rect x="548" y="62" width="84" height="26" rx="13"/><text x="590" y="79">ROBOT</text></g>
  <g class="node mono"><rect x="658" y="62" width="84" height="26" rx="13"/><text x="700" y="79">DATA</text></g>
  <g class="node mono"><rect x="762" y="62" width="96" height="26" rx="13"/><text x="810" y="79">SOFTWARE</text></g>
  <g class="node mono"><rect x="768" y="172" width="84" height="26" rx="13"/><text x="810" y="189">HUMAN</text></g>
  <g class="node hot mono"><rect x="658" y="172" width="84" height="26" rx="13"/><text x="700" y="189">ACTION</text></g>

  <text x="700" y="134" class="mono" fill="#6e7681" font-size="11" text-anchor="middle">the interesting problems</text>
  <text x="700" y="150" class="mono" fill="#6e7681" font-size="11" text-anchor="middle">live between the boxes</text>
</svg>
